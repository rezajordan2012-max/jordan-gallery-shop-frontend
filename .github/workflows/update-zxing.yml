name: Update ZXing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-zxing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Update ZXing
        run: npm install @zxing/browser@0.2.1

      - name: Commit package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "Update ZXing browser to 0.2.1"
          git push
